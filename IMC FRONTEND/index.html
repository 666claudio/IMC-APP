<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="imc.css">
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <form>
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" placeholder="Introduce tu peso" />

        <br><br>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" placeholder="Introduce tu altura" />

        <br><br>

        <button type="button" onclick="calcularIMC()">Calcular IMC</button>
    </form>

    <h2>Resultado</h2>
    <p id="resultado">Tu IMC es: 0</p>
    <p id="categoria"></p>
    <div id="historial"></div>

    <script src="imc.js"></script>
</body>
</html>
